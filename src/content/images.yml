# Illustraties (zie docs/concept.md › Illustraties).
#
# Vervangen: upload het nieuwe beeld en kies het bij `src`. Houd dezelfde
# beeldverhouding als width × height, dan verspringt de layout niet.
# Alt-teksten beschrijven het beeld, niet het verhaal (dat staat in de tekst).
#
# Bron: ChatGPT-illustraties, vrijgesteld met scripts/process-illustrations.py.
# Het vliegtuigraam bestaat uit lagen op hetzelfde canvas (raam, glasmasker, rolluik,
# uitzichten); vervang die alleen samen, via het script.
# TODO: nachtversies van uitzicht, Amsterdam en Mas Terrats (nu gedimd via een filter).

