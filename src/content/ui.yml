# Labels en knoppen per taal. Mono-labels worden in hoofdletters getoond.

# Naam van elke taal in die taal zelf (voor de taalwisselaar en de keuzepagina).
languages:
  en: English
  es: Español
  nl: Nederlands

language_switcher:
  en: Choose language
  es: Elegir idioma
  nl: Kies taal

choose_language: # tekst op de keuzepagina als JavaScript uit staat
  en: Choose your language
  es: Elijan su idioma
  nl: Kies je taal

scroll_to_board:
  en: Scroll to board
  es: Desliza para embarcar
  nl: Scroll om te boarden

skip_to_details:
  en: Skip to details ↓
  es: Ir a los detalles ↓
  nl: Naar de details ↓

replay_story:
  en: ▶ Replay our story
  es: ▶ Ver nuestra historia otra vez
  nl: ▶ Ons verhaal opnieuw afspelen

shade_close:
  en: Close the window shade (night mode)
  es: Bajar la persiana (modo noche)
  nl: Rolluik dicht (nachtmodus)

shade_open:
  en: Open the window shade (day mode)
  es: Subir la persiana (modo día)
  nl: Rolluik open (dagmodus)

rsvp:
  heading:
    en: Boarding pass
    es: Pase de abordar
    nl: Boardingpass
  intro:
    en: Please let us know before {deadline}.
    es: Por favor avísennos antes del {deadline}.
    nl: Laat het ons weten vóór {deadline}.
  name:
    en: Name
    es: Nombre
    nl: Naam
  party_size:
    en: Number of guests
    es: Número de invitados
    nl: Aantal personen
  attending:
    en: Will you be there?
    es: ¿Nos acompañan?
    nl: Zijn jullie erbij?
  attending_yes:
    en: Yes, wouldn't miss it
    es: Sí, no nos lo perdemos
    nl: Ja, voor geen goud missen
  attending_no:
    en: Sadly, no
    es: Lamentablemente, no
    nl: Helaas niet
  diet:
    en: Dietary requirements
    es: Restricciones alimentarias
    nl: Dieetwensen
  submit:
    en: Check in
    es: Hacer check-in
    nl: Inchecken
  confirmed:
    en: Confirmed
    es: Confirmado
    nl: Bevestigd
  error:
    en: Something went wrong. Please try again.
    es: Algo salió mal. Por favor intenten de nuevo.
    nl: Er ging iets mis. Probeer het nog eens.
  offline:
    en: You seem to be offline. We'll try again when you're back.
    es: Parece que no tienen conexión. Lo intentaremos de nuevo cuando vuelva.
    nl: Je lijkt offline te zijn. We proberen het opnieuw zodra je weer verbinding hebt.
